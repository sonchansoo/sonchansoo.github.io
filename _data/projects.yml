- name: Multi-Agent Reinforcement Learning Framework for Attack and Defense Intelligence in Drone Soccer
  gh_user: sonchansoo
  repo: 
  img: /Users/sonchansoo/Desktop/github.io/sonchansoo.github.io/images/projects/Dsoccer0.png
  media:
    - image: /Users/sonchansoo/Desktop/github.io/sonchansoo.github.io/images/projects/Dsoccer1.png
    - video: https://youtu.be/raPFnHFL2Dc
  sections:
    - title: 개요
      content: |
        NVIDIA Isaac Lab 기반의 물리적으로 사실적인 드론-사커(Drone Soccer) 시뮬레이션에서,
        공격수(Attacker)와 수비수(Defender) 두 UAV 에이전트가 **서로 상반된 목표(제로섬)** 로 경쟁하도록 구성한
        **경쟁형 Multi-Agent Reinforcement Learning(MARL) 프레임워크**를 구현했습니다.
        
        공격수는 상대 링(골)을 통과해 득점하는 전략을 학습하고, 수비수는 링 주변에서 방어 위치를 유지하며
        진입/통과를 저지(블로킹 포함)하는 전략을 학습합니다. 이 과정은 self-play 기반으로 지속적으로 상대가 강해지는
        비정상(non-stationary) 환경에서 정책이 함께 진화하도록 설계했습니다. :contentReference[oaicite:0]{index=0}

    - title: 핵심 설계 및 성과
      content: |
        - **환경/시나리오 설계:** 드론-사커 규칙을 반영한 3D 경쟁 환경(링/골, 충돌 및 블로킹 허용, go/return 단계) 구성 :contentReference[oaicite:1]{index=1}
        - **관측(Observation) 구성:** 자가 상태(속도/각속도/중력 투영) + 과제 관련(링 중심/반경 거리/단계 one-hot) + 상대 정보(상대 위치/속도)로 상태 벡터 설계 :contentReference[oaicite:2]{index=2}
        - **보상(Reward) 설계:** EMA-normalized shaping reward + 이벤트 보상(링 통과, 리턴 성공, 홀드/블록 이벤트 등)로 학습 안정화 및 전략 유도 :contentReference[oaicite:3]{index=3}
        - **학습 프레임워크:** self-play 기반 **MAPPO**로 공격/수비 정책을 동시 경쟁 학습(제로섬 리턴이 균형 근처로 수렴) :contentReference[oaicite:4]{index=4}
        - **평가 프로토콜:** Elo rating으로 장기 성능 추적 + cross-play matrix로 세대 간 정책 우위/안정성/순환 지배 여부 점검 :contentReference[oaicite:5]{index=5}
        - **실험 결과:** 최신 공격 정책이 과거 수비 정책을 크게 상회(A@1020k vs D@700k winrate ≈ 0.80), 최신끼리도 공격 우세(A@1020k vs D@1020k winrate ≈ 0.66)이며 강한 cyclic dominance는 관찰되지 않음 :contentReference[oaicite:6]{index=6}
  desc: |
    Competitive drone-soccer MARL framework in NVIDIA Isaac Lab: a physically realistic 3D attacker–defender (zero-sum) setting trained via self-play MAPPO.
    The project contributes (1) a structured drone-soccer simulation with role-specific observations, (2) EMA-normalized shaping + event reward design for stable learning,
    and (3) an evaluation protocol using Elo rating and cross-play matrices to verify policy progression and robustness. :contentReference[oaicite:7]{index=7}

