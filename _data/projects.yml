- name: Multi-Agent Reinforcement Learning Framework for Attack and Defense Intelligence in Drone Soccer
  gh_user: sonchansoo
  repo: 
  img: /images/projects/Dsoccer0.png
  media:
    - video: https://youtu.be/raPFnHFL2Dc
    - image: /images/projects/Dsoccer1.png
    - image: /images/projects/Dsoccer2.png
    - image: /images/projects/Dsoccer3.png
    - image: /images/projects/Dsoccer4.png
    - image: /images/projects/Dsoccer5.png
    - image: /images/projects/Dsoccer6.png
    - image: /images/projects/Dsoccer7.png
    - image: /images/projects/Dsoccer8.png
    - image: /images/projects/Dsoccer9.png
  sections:
    - title: 개요
      content: |
        NVIDIA Isaac Lab 기반의 물리적으로 사실적인 Drone Soccer 시뮬레이션에서,
        공격수(Attacker)와 수비수(Defender) 두 UAV 에이전트가 **서로 상반된 목표(제로섬)** 로 경쟁하도록 구성한
        **경쟁형 Multi-Agent Reinforcement Learning(MARL) 프레임워크**를 구현했습니다.
        
        공격수는 상대 링(골)을 통과해 득점하는 전략을 학습하고, 수비수는 링 주변에서 방어 위치를 유지하며
        진입/통과를 저지(블로킹 포함)하는 전략을 학습합니다. 이 과정은 self-play 기반으로 지속적으로 상대가 강해지는
        비정상(non-stationary) 환경에서 정책이 함께 진화하도록 설계했습니다. 

    - title: 핵심 설계 및 성과
      content: |
        - **환경/시나리오 설계:** 드론-사커 규칙을 반영한 3D 경쟁 환경(링/골, 충돌 및 블로킹 허용, go/return 단계) 구성 
        - **관측(Observation) 구성:** 자가 상태(속도/각속도/중력 투영) + 과제 관련(링 중심/반경 거리/단계 one-hot) + 상대 정보(상대 위치/속도)로 상태 벡터 설계 
        - **보상(Reward) 설계:** EMA-normalized shaping reward + 이벤트 보상(링 통과, 리턴 성공, 홀드/블록 이벤트 등)로 학습 안정화 및 전략 유도 
        - **학습 프레임워크:** self-play 기반 **MAPPO**로 공격/수비 정책을 동시 경쟁 학습(제로섬 리턴이 균형 근처로 수렴) 
        - **평가 프로토콜:** Elo rating으로 장기 성능 추적 + cross-play matrix로 세대 간 정책 우위/안정성/순환 지배 여부 점검 
        - **실험 결과:** 최신 공격 정책이 과거 수비 정책을 크게 상회(A@1020k vs D@700k winrate ≈ 0.80), 최신끼리도 공격 우세(A@1020k vs D@1020k winrate ≈ 0.66)이며 강한 cyclic dominance는 관찰되지 않음 
  desc: |
    NVIDIA Isaac Lab 기반의 경쟁형 드론-사커 MARL 프레임워크로, 물리적으로 사실적인 3D 공격수–수비수(제로섬) 환경에서 self-play MAPPO로 학습했습니다.
    본 프로젝트의 기여는 (1) 역할별 관측을 갖춘 구조화된 드론-사커 시뮬레이션, (2) 학습 안정화를 위한 EMA-normalized shaping 보상 + 이벤트 보상 설계, (3) 정책의 세대별 향상과 강건성을 검증하기 위한 Elo rating 및 cross-play matrix 기반 평가 프로토콜입니다. 

- name: Proximal Policy Optimization for Robotic Arm Docking Control in Space Environments
  gh_user: sonchansoo
  repo: Tello_contents
  img: /images/projects/Docking0.png
  media:
    - image: /images/projects/Docking0.png
    - video: https://youtu.be/BiAmmh4AXGI
  sections:
    - title: 개요
      content: |
        우주(무중력) 환경을 가정한 시뮬레이션에서 로봇팔(VX300S)이 **위성 모듈(Target)** 을 잡아 원하는 위치에 정렬한 뒤
        **도킹(docking)** 까지 수행하도록, 강화학습(PPO) 기반 제어 환경을 구성한 프로젝트입니다.
        Isaac Lab/Isaac Sim 기반으로 물리 환경을 만들고, 도킹 작업을 단계별 과업(approach→grasp→transport→docking)으로 나눠 학습 안정성을 확보했습니다. 

    - title: 환경/상태/행동 설계
      content: |
        - **행동(Action):** VX300S 로봇팔 6개 관절을 연속 제어
        - **관측(Observation):** 관절 위치/속도 + EE(end-effector) 위치 + 타겟/도킹 포인트/패널 간 상대 벡터 + 거리 + 축 정렬(dot product) + 단계 one-hot 등으로 구성 
        - **물리 설정:** 중력 비활성(disable_gravity), 감쇠(damping) 등 우주 환경 느낌을 주는 파라미터를 설정함

    - title: 도킹 파이프라인(단계별 상태머신)
      content: |
        도킹 작업을 다음 상태로 관리합니다. 
        - **APPROACH:** 그랩 목표점까지 접근
        - **GRASPED:** 일정 스텝 동안 그랩 유지(hold)
        - **TRANSPORT:** 타겟을 목표 패널 근처로 이동
        - **DOCKING:**  도킹 완료
        - **COMPLETED:** 성공 처리


    - title: 보상/종료 조건
      content: |
        - **보상(Reward):** 단계별로 “가까워지기(거리 지수형) + 정렬(축 dot) + 그랩 성공/유지 보너스 + 도킹 큰 보상” 구조로 설계하고,
          큰 행동을 억제하기 위해 action penalty를 추가했습니다. 
        - **종료(Done):** 도킹 성공(COMPLETED), 범위 이탈(out-of-bounds), 접근 단계에서 타겟이 너무 멀어짐(escape),
          그랩 후 거리 임계값을 넘는 grasp lost 등을 종료 조건으로 사용했습니다. 

  desc: |
    Isaac Lab 기반 무중력(우주) 환경에서 VX300S 로봇팔이 위성 모듈을 잡고 지정 패널에 정렬해 도킹까지 수행하도록
    PPO 학습용 RL 환경을 구현했습니다. 안정적으로 approach→grasp→transport→dock를 학습하도록 설계했습니다. 

- name: Graph-Based Gesture Recognition 기반 One-Handed 6-DoF 드론 조종 시스템
  gh_user: sonchansoo
  repo:  # TODO: 실제 GitHub 저장소 URL/경로로 교체
  img: /images/projects/OHD0.png
  media:
    - image: /images/projects/OHD0.png
    - video: https://youtu.be/uPFVPq7UdDc
  sections:
    - title: 개요
      content: |
        드론 활용 확산에 따라 **직관적이고 접근성 높은 제어 인터페이스**가 필요하다는 문제의식에서 출발해,
        **한 손(one-handed) 제스처 인식**만으로 드론의 **6-DoF(roll/pitch/yaw/throttle + 이동)** 를 조종하는 시스템을 제안했습니다.
        기존 조이스틱/양손 제스처 기반 방식의 멀티태스킹 제약, 정밀도·동시제어 한계, 주변 기능 사용 제약(카메라 등)을 완화하는 것을 목표로 합니다. 

    - title: 제안 방법
      content: |
        - **한 손 제스처 정의/설계:** 한손 컨트롤러 개념을 차용해 **엄지 방향으로 전후좌우 이동**을 표현하고,
          나머지 손가락 조합으로 추가 축/명령을 표현하여 **6축 자유도 및 멀티-커맨드**를 지원하도록 설계했습니다. 
        - **데이터셋 구성 및 증강:** 실제 사용 환경 변화를 반영하기 위해
          Rotation(각도 변화), Flip(좌/우손 고려), Perspective(원근 변화) 증강을 적용했습니다. 
        - **모델 학습:** 스켈레톤 그래프 기반 동작 인식에서 성능이 검증된 **TD-GCN**을 사용했고,
          채널을 분리해 채널 간 간섭을 줄이는 방향으로 학습을 구성했습니다(드롭아웃/랜덤 적용 및 공격적 증강). 

    - title: 실험 및 결과
      content: |
        - **비교 실험:** ST-GCN 대비 TD-GCN이 **Top-1 정확도에서 우세**했습니다. 
        - **증강 효과:** Rotation과 Perspective를 **함께 적용**했을 때 정확도가 상승했으며,
          실제 환경에서 각도 변화와 원근 변화가 동시에 발생하므로 두 증강을 함께 학습하는 것이 중요함을 확인했습니다. 
        - **해석:** ST-GCN은 Top-5에서는 강점이 있으나, 유사 후보군 내에서 정답을 구분하는 변별력(Top-1)은 TD-GCN이 더 우수한 경향을 보였습니다. 

    - title: 한계 및 향후 과제
      content: |
        - **한계:** 축소/확대(원근)에는 대응했지만 손의 **yaw 회전**에는 미대응이며,
          손가락 겹침으로 인한 pose estimation 노이즈가 발생할 수 있습니다. 또한 다양한 드론 기종에 대한 실험이 충분하지 않습니다. 
        - **향후:** 전이학습 기반 **개인화(few-shot 등)** 로 커맨드를 즉석 생성/적응하는 방향,
          실제 비행 환경에서의 정량 검증, 다중 드론 제어/장애물 회피/자율비행 보조 등 고차원 임무로 확장 계획을 제시했습니다. 

  desc: |
    한 손 제스처만으로 드론의 6-자유도 조종을 가능하게 하는 그래프 기반 제스처 인식 시스템.
    Rotation/Flip/Perspective 증강으로 실사용 환경 변화를 반영하고 TD-GCN 기반 스켈레톤 그래프 학습으로
    ST-GCN 대비 Top-1 정확도 향상을 확인함.

- name: FoodHabitGame (냠냠쩝쩝팡팡) — AI 기반 어린이 식습관 개선 게임
  gh_user: sonchansoo
  repo:  # TODO: 실제 GitHub 저장소 URL (예: https://github.com/sonchansoo/FoodHabitGame)
  img: /images/projects/food0.png
  media:
    - image:  # TODO: 데모 GIF/스크린샷 URL (예: https://.../demo.gif)
    - video: https://youtu.be/SDVlVpFXJcQ
  sections:
    - title: 개요
      content: |
        4~8세 어린이의 편식 문제를 완화하기 위해 개발한 **AI 기반 모바일 게임(Flutter)** 입니다.
        스마트폰 전면 카메라로 아이의 **먹기 행동**과 **채소 섭취(13종)** 를 실시간 인식하고,
        게임화(전투/보상/성취) 메커니즘으로 자연스럽게 올바른 식습관 형성을 유도합니다.

    - title: 주요 기능
      content: |
        - **실시간 인식**
          - YOLO 기반 13종 채소 탐지(객체 탐지)
          - MobileNetV2 기반 먹기 행동 분류
          - Google ML Kit 얼굴 탐지로 입 주변 ROI 추출
        - **게임 메커니즘**
          - 먹기 동작 → 에너지 충전/일반 공격
          - 채소 섭취 → 특수 공격(보스 처치)
          - 골드/보상 시스템으로 동기 강화
        - **기록/추적**
          - WHO 기준 연령별 목표 섭취량 반영
          - Firebase에 일별 섭취 기록 저장
          - 캘린더 형태로 진행 상황 확인

    - title: 기술 스택 및 데이터
      content: |
        - **Frontend:** Flutter, Flame Engine
        - **Backend/DB:** Firebase(인증/DB), Firebase Analytics
        - **AI/On-device:** TensorFlow Lite
        - **Models:** YOLO(v11) 채소 탐지, MobileNetV2 먹기 인식, Google ML Kit(얼굴/특징점)
        - **Dataset**
          - 채소 이미지: Roboflow 기반(13 클래스, 5,000+)
          - 먹기 행동: 자체 수집/라벨링(8,500장)

    - title: 성능 및 기대 효과
      content: |
        - **모델 성능(프로젝트 기준)**
          - 채소 인식 정확도: 95%+
          - 먹기 인식 정확도: 92%+
          - 실시간 처리: 10–15 FPS
        - **기대 효과**
          - 어린이: 편식 개선, 식사 집중도 향상, 채소에 대한 긍정 경험
          - 부모: 식사 스트레스 감소, 객관적 모니터링, 갈등 완화

  desc: |
    Flutter 기반 2D 게임에 on-device AI(TFLite)를 결합해, 전면 카메라로 먹기 행동과 채소 섭취를 실시간 인식하고
    전투/보상 루프로 섭취 동기를 강화하는 어린이 식습관 개선 게임. YOLO(13종 채소 탐지) + MobileNetV2(먹기 인식) +
    ML Kit(얼굴 ROI) + Firebase(기록/분석)로 구성.

